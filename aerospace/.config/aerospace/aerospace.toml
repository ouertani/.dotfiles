config-version = 2

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']


# ============================================================
# Gaps
# ============================================================

gaps.inner.horizontal = 8
gaps.inner.vertical   = 8
gaps.outer.left       = 8
gaps.outer.bottom     = 8
gaps.outer.top        = 8
gaps.outer.right      = 8


# ============================================================
# Application placement
# ============================================================

on-window-detected = [

    # Brave → workspace 1
    {
        if = 'test %{app-bundle-id} = com.brave.Browser',
        run = ['move-node-to-workspace 1'],
    },

    # cmux → workspace 1
    {
        if = 'test %{app-bundle-id} = com.cmuxterm.app',
        run = ['move-node-to-workspace 1'],
    },

    # Slack → workspace 1
    {
        if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap',
        run = ['move-node-to-workspace 1'],
    },

    # Discord → workspace 1
    {
        if = 'test %{app-bundle-id} = com.hnc.Discord',
        run = ['move-node-to-workspace 1'],
    },

    # Teams → workspace 1
    {
        if = 'test %{app-bundle-id} = com.microsoft.teams2',
        run = ['move-node-to-workspace 1'],
    },

    # Mail → workspace 1
    {
        if = 'test %{app-bundle-id} = com.apple.mail',
        run = ['move-node-to-workspace 1'],
    },

    # Finder → workspace 1
    {
        if = 'test %{app-bundle-id} = com.apple.finder',
        run = ['move-node-to-workspace 1'],
    },

    # TextEdit → workspace 1
    {
        if = 'test %{app-bundle-id} = com.apple.TextEdit',
        run = ['move-node-to-workspace 1'],
    },
]


# ============================================================
# Main bindings
# ============================================================

[mode.main.binding]

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
